name: Release Validation (without emulator)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m" -Dkotlin.compiler.execution.strategy="in-process"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Prepare public service configuration
        env:
          LICENSE_ENDPOINT: ${{ vars.LICENSE_ENDPOINT }}
          ACCOUNT_PUBLIC_KEY: ${{ vars.ACCOUNT_LICENSE_PUBLIC_KEY }}
          LOCAL_PUBLIC_KEY: ${{ vars.LOCAL_LICENSE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          printf '%s' "$LICENSE_ENDPOINT" > app/src/main/assets/license_endpoint.txt
          printf '%s\n' "$ACCOUNT_PUBLIC_KEY" > app/src/main/assets/license_account_public.pem
          printf '%s\n' "$LOCAL_PUBLIC_KEY" > app/src/main/assets/license_local_public.pem
          test -s app/src/main/assets/license_endpoint.txt
          test -s app/src/main/assets/license_account_public.pem
          test -s app/src/main/assets/license_local_public.pem

      - name: Verify Gradle Wrapper
        run: |
          set -euo pipefail
          test -s ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null
          bash ./gradlew --version

      - name: Run lint and complete unit-test suite
        run: bash ./gradlew clean lintDebug testDebugUnitTest --stacktrace --no-parallel --max-workers=1

      - name: Setup and Verify Release Keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          KEYSTORE_DEST: app/aldaftar.keystore
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_SHA256"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          test -s "$KEYSTORE_DEST"
          CERT_OUTPUT=$(keytool -list -v -keystore "$KEYSTORE_DEST" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1)
          EXTRACTED_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256_CLEAN=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test -n "$EXTRACTED_SHA256"
          test "$EXTRACTED_SHA256" = "$EXPECTED_SHA256_CLEAN"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE || 'aldaftar.keystore' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" --stacktrace --no-parallel --max-workers=1

      - name: Verify Release APK signature
        env:
          EXPECTED_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          test -n "$APK_PATH"
          APKSIGNER_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          SIGN_VERIFY_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH" 2>&1)
          ACTUAL_SHA256=$(printf '%s\n' "$SIGN_VERIFY_OUTPUT" | grep -iE "SHA-256 digest|SHA256:" | head -n 1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//I; s/.*SHA256:[[:space:]]*//I' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256_CLEAN=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' | tr '[:upper:]')
          test -n "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256_CLEAN"

      - name: Build signed Release AAB
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE || 'aldaftar.keystore' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew bundleRelease -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" --stacktrace --no-parallel --max-workers=1

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Daftar-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Al-Daftar-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
