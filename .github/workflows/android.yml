name: Build Mizan Al-Daftar App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.daemon=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The signing key is never committed to Git.
      # KEYSTORE_BASE64 must contain the Base64 output of aldaftar.keystore.
      - name: Restore release keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "❌ KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/aldaftar.keystore
          if [ ! -s app/aldaftar.keystore ]; then
            echo "❌ Failed to restore app/aldaftar.keystore."
            exit 1
          fi
          chmod 600 app/aldaftar.keystore
          echo "✅ Release keystore restored securely."

      - name: Create .env file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          {
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
          } > .env
          chmod 600 .env

      - name: Verify Gradle wrapper
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            echo "❌ gradlew is missing from the repository."
            exit 1
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "❌ gradle/wrapper/gradle-wrapper.jar is missing."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Verify release keystore and certificate
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          EXPECTED_SHA1: "4985981003E3502B632056CB931AE3804F6859F8"
        run: |
          set -euo pipefail
          KEYSTORE_FILE="app/aldaftar.keystore"
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "❌ RELEASE_STORE_PASSWORD secret is missing."
            exit 1
          fi
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "❌ Release keystore not found: $KEYSTORE_FILE"
            exit 1
          fi
          echo "🔐 Verifying release keystore alias: $KEY_ALIAS"
          CERT_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1)"
          EXTRACTED_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | grep -i "SHA1:" | head -n 1 | sed -E 's/.*SHA1:[[:space:]]*//' | tr -d ':' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          if [ -z "$EXTRACTED_SHA1" ]; then
            echo "❌ Could not extract SHA-1 from release certificate."
            exit 1
          fi
          echo "Expected SHA-1: $EXPECTED_SHA1"
          echo "Actual SHA-1:   $EXTRACTED_SHA1"
          if [ "$EXTRACTED_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "❌ CRITICAL: Release keystore SHA-1 does not match the expected certificate."
            exit 1
          fi
          echo "✅ Release keystore and SHA-1 verified."

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: app/aldaftar.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_STORE_PASSWORD:-}" ]; then
            echo "❌ RELEASE_STORE_PASSWORD secret is missing."
            exit 1
          fi
          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "❌ RELEASE_KEY_PASSWORD secret is missing."
            exit 1
          fi
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            --stacktrace \
            --no-parallel \
            --max-workers=1

      - name: Verify signed Release APK
        env:
          EXPECTED_SHA1_CLEAN: "4985981003E3502B632056CB931AE3804F6859F8"
          EXPECTED_SHA1_FORMATTED: "49:85:98:10:03:E3:50:2B:63:20:56:CB:93:1A:E3:80:4F:68:59:F8"
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ Release APK was not found."
            exit 1
          fi
          echo "📦 APK: $APK_PATH"
          APKSIGNER_BIN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1 || true)"
          if [ -z "$APKSIGNER_BIN" ] || [ ! -x "$APKSIGNER_BIN" ]; then
            echo "❌ apksigner was not found in the Android SDK."
            exit 1
          fi
          SIGN_VERIFY_OUTPUT="$("$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH" 2>&1)"
          printf '%s\n' "$SIGN_VERIFY_OUTPUT"
          ACTUAL_SHA1_FORMATTED="$(printf '%s\n' "$SIGN_VERIFY_OUTPUT" | grep -iE 'Signer #1 certificate SHA-1 digest:' | head -n 1 | sed -E 's/.*SHA-1 digest:[[:space:]]*//' | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          ACTUAL_SHA1_CLEAN="$(printf '%s' "$ACTUAL_SHA1_FORMATTED" | tr -d ':')"
          echo "Expected SHA-1: $EXPECTED_SHA1_FORMATTED"
          echo "Actual SHA-1:   $ACTUAL_SHA1_FORMATTED"
          if [ "$ACTUAL_SHA1_CLEAN" != "$EXPECTED_SHA1_CLEAN" ]; then
            echo "❌ CRITICAL: APK certificate fingerprint does not match the release key."
            exit 1
          fi
          echo "✅ APK signature verification PASSED."

      - name: Upload verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Daftar-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove restored keystore
        if: always()
        run: |
          rm -f app/aldaftar.keystore
          echo "🧹 Temporary release keystore removed from runner."
