name: Build Mizan Al Dar App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # حماية حقيقية للذاكرة وإجبار مترجم كوتلن و KSP لتفادي NPE و OOM
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1024m" -Dkotlin.compiler.execution.strategy="in-process"
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare public service configuration
        env:
          LICENSE_ENDPOINT: ${{ vars.LICENSE_ENDPOINT }}
          ACCOUNT_PUBLIC_KEY: ${{ vars.ACCOUNT_LICENSE_PUBLIC_KEY }}
          LOCAL_PUBLIC_KEY: ${{ vars.LOCAL_LICENSE_PUBLIC_KEY }}
        run: |
          set -e
          mkdir -p app/src/main/assets
          if [ -n "$LICENSE_ENDPOINT" ]; then
            printf '%s' "$LICENSE_ENDPOINT" > app/src/main/assets/license_endpoint.txt
          fi
          if [ ! -s app/src/main/assets/license_endpoint.txt ]; then
            echo "❌ ملف license_endpoint.txt غير موجود وقيمة vars.LICENSE_ENDPOINT غير متوفرة."
            exit 1
          fi
          if [ -n "$ACCOUNT_PUBLIC_KEY" ]; then
            printf '%s\n' "$ACCOUNT_PUBLIC_KEY" > app/src/main/assets/license_account_public.pem
          fi
          if [ -n "$LOCAL_PUBLIC_KEY" ]; then
            printf '%s\n' "$LOCAL_PUBLIC_KEY" > app/src/main/assets/license_local_public.pem
          fi
          if [ ! -s app/src/main/assets/license_account_public.pem ] || [ ! -s app/src/main/assets/license_local_public.pem ]; then
            echo "❌ مفاتيح الترخيص العامة (ACCOUNT_LICENSE_PUBLIC_KEY أو LOCAL_LICENSE_PUBLIC_KEY) غير مكتملة في GitHub Variables."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 1. إعداد شهادة Debug القياسية لنظام أندرويد فقط في مسارها النظامي بدون أي مساس بملفات الـ Release
      - name: Set up Standard Android Debug Keystore
        run: |
          echo "🔑 Preparing standard Android debug keystore..."
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # ممنوع منعاً باتاً نسخ debug.keystore إلى aldaftar.keystore أو تعويض أي release keystore

      # 2. تجهيز مستودع الإصدار من أسرار GitHub والتحقق من الشهادة دون تخزين أي سر في المستودع
      - name: Setup and Verify Release Keystore from GitHub Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          KEYSTORE_DEST: "app/aldaftar.keystore"
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo "❌ أحد أسرار التوقيع المطلوبة غير موجود في GitHub Secrets."
            exit 1
          fi

          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DEST"
          test -s "$KEYSTORE_DEST"

          CERT_OUTPUT=$(keytool -list -v -keystore "$KEYSTORE_DEST" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1)
          EXTRACTED_SHA256=$(printf '%s\n' "$CERT_OUTPUT" | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256_CLEAN=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')

          if [ -z "$EXTRACTED_SHA256" ] || [ "$EXTRACTED_SHA256" != "$EXPECTED_SHA256_CLEAN" ]; then
            echo "❌ شهادة الإصدار لا تطابق بصمة SHA-256 الموجودة في GitHub Secrets."
            exit 1
          fi

          echo "✅ تم التحقق من مستودع توقيع الإصدار."

      # 3. التحقق من سلامة Gradle Wrapper
      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "⚠️ Gradle wrapper jar is missing or corrupted! Generating valid wrapper..."
            mkdir -p gradle/wrapper
            if command -v gradle &> /dev/null; then
              gradle wrapper --gradle-version 9.3.1
            else
              curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar || true
            fi
          fi
          chmod +x gradlew || true

      # 4. بناء نسخة Release مع تمرير بارامترات التوقيع الموثقة
      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE || 'aldaftar.keystore' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'aldaftar' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "🚀 Building Release APK with verified signing configuration..."
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            --stacktrace --no-parallel --max-workers=1

      # 5. الفحص الإجباري لشهادة Release APK باستخدام البصمة المحفوظة في GitHub Secrets
      - name: Verify Release APK Signature
        env:
          EXPECTED_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ لم يتم العثور على ملف Release APK."
            exit 1
          fi

          APKSIGNER_BIN=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN="apksigner"
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            APKSIGNER_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1 || true)
          elif [ -n "$ANDROID_HOME" ]; then
            APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1 || true)
          fi

          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            SIGN_VERIFY_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "$APK_PATH" 2>&1)
          else
            SIGN_VERIFY_OUTPUT=$(keytool -printcert -jarfile "$APK_PATH" 2>&1)
          fi

          ACTUAL_SHA256=$(printf '%s\n' "$SIGN_VERIFY_OUTPUT" | grep -iE "SHA-256 digest|SHA256:" | head -n 1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//I; s/.*SHA256:[[:space:]]*//I' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256_CLEAN=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')

          if [ -z "$EXPECTED_SHA256_CLEAN" ] || [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256_CLEAN" ]; then
            echo "❌ توقيع Release APK لا يطابق بصمة SHA-256 الموجودة في GitHub Secrets."
            exit 1
          fi

          echo "✅ تم التحقق من توقيع Release APK."

      # 6. رفع حزمة Release APK المؤكدة فقط بعد اجتياز فحص البصمة
      - name: Upload Verified Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Daftar-Release-APK
          path: app/build/outputs/apk/release/*.apk
