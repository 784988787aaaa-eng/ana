name: Firebase Backend Validation

on:
  push:
    paths:
      - "firebase/**"
      - ".github/workflows/firebase-backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check index.js
          node --check worker.js
          node --check kv-compat.js

      - name: Run backend tests
        run: npm test
