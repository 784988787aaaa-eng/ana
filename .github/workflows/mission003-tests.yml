name: Mission 003 Unit Tests

on:
  push:
    branches:
      - mission-003-data-integrity-fix
      - mission-003-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        -Dkotlin.compiler.execution.strategy=in-process
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: true
      - name: Run Mission 003 regression tests
        run: >-
          bash ./gradlew testDebugUnitTest
          --tests com.smartledger.aldaftar.data.local.TrashRestorePersistenceTest
          --tests com.smartledger.aldaftar.data.repository.HabayebCategoryDataRepositoryTest
          --no-daemon --stacktrace --parallel --max-workers=4
